# Alembic Configuration — NASO Backend
# Generato automaticamente; non modificare i path senza aggiornare env.py

[alembic]
# The migration tree used to live in backend/alembic/, with an __init__.py in
# it. The API image sets PYTHONPATH=/app, so `import alembic` resolved to that
# directory instead of the installed package and the CLI died before it read
# this file, from any working directory:
#
#     File "/usr/local/bin/alembic", line 5, in <module>
#       from alembic.config import main
#   ModuleNotFoundError: No module named 'alembic.config'
#
# Which is the deeper reason no migration had ever run: not that nobody invoked
# it, but that invoking it was impossible. `migrations` is the conventional name
# and cannot shadow the package.
#
# %(here)s is this file's directory, so the path holds regardless of the working
# directory alembic is invoked from.
script_location = %(here)s/migrations
prepend_sys_path = .

# La URL viene sovrascritta in env.py leggendo DATABASE_URL dall'ambiente.
# Non impostare sqlalchemy.url qui per evitare credenziali in chiaro.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
