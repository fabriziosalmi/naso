[tool.ruff]
# Enable Pyflakes (F), pycodestyle (E, W), isort (I), pyupgrade (UP), flake8-bugbear (B), and flake8-simplify (SIM)
lint.select = ["E", "F", "I", "UP", "B", "SIM"]
lint.ignore = ["E501", "B008", "E402", "B904", "E741", "SIM102"] # Ignore long lines, FastAPI Depends, top-level imports and B904 for Celery retry

# Allow autofix for all enabled rules
lint.fixable = ["ALL"]
lint.unfixable = []

# Exclude common directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    # ruff 0.16 formats Python inside Markdown fences. Documentation snippets
    # are illustrative rather than shipped code, and collapsing a deliberately
    # multi-line example onto one 96-column line makes the docs worse.
    "*.md",
]

# Set line length to 120
line-length = 120

# The runtime is python:3.11-slim (both Dockerfiles). Raising this to py311
# is worthwhile but is a code-modernization change of its own: it surfaces
# 60 UP findings, some of which alter semantics (datetime.utcnow is naive,
# datetime.now(UTC) is not). Tracked separately.
target-version = "py39"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
# pytest-asyncio 1.x removed the custom `event_loop` fixture override that
# backend/tests/conftest.py used to declare. Pinning both loop scopes to
# "session" reproduces what that fixture provided: one event loop for the
# whole run, so the session-scoped `db_engine` fixture and the function-scoped
# tests that depend on it live on the same loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Register the custom markers we use so pytest stops emitting
# "Unknown pytest.mark.*" warnings. Each line is "name: description".
markers = [
    "live: requires a live external service (e.g. LM Studio at LM_STUDIO_URL). Skipped when the dependency is unreachable.",
    "timeout: per-test wall-clock cap (provided by the pytest-timeout plugin).",
]
# Silence the pydantic-settings probe for /run/secrets — that's the Docker
# secret-mount convention and is expected to be absent outside a
# container. The warning is not actionable in dev/test environments.
filterwarnings = [
    "ignore:directory .* does not exist:UserWarning:pydantic_settings.sources.providers.secrets",
]
