services:
  db:
    image: postgres:15-alpine
    container_name: naso-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME}
    secrets:
      - db_password
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # These official images start as root to chown their data directory and
    # then drop to their service user, which needs SETUID/SETGID; the chown
    # itself needs CHOWN/FOWNER/DAC_OVERRIDE. With `cap_drop: ALL` and nothing
    # added back they crash-loop before the server ever starts (redis exits
    # 127 — its entrypoint cannot exec). These grants used to live in a
    # docker-compose.override.yml, which Compose applied automatically and
    # invisibly; they are stated here instead. The API and worker containers,
    # which run application code, keep `cap_drop: ALL` with nothing added.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - SETFCAP
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - naso-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: naso-cache
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # These official images start as root to chown their data directory and
    # then drop to their service user, which needs SETUID/SETGID; the chown
    # itself needs CHOWN/FOWNER/DAC_OVERRIDE. With `cap_drop: ALL` and nothing
    # added back they crash-loop before the server ever starts (redis exits
    # 127 — its entrypoint cannot exec). These grants used to live in a
    # docker-compose.override.yml, which Compose applied automatically and
    # invisibly; they are stated here instead. The API and worker containers,
    # which run application code, keep `cap_drop: ALL` with nothing added.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - SETFCAP
    networks:
      - naso-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: naso-search
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      # Straight from .env, not through /run/secrets, and that is the whole
      # point. Elasticsearch validates the mode of a password file and accepts
      # only 400 or 600; the API and worker containers run cap_drop: ALL, have
      # no CAP_DAC_OVERRIDE, and so need the secrets they read to be 0444. Both
      # constraints are real and they contradict each other on one shared
      # directory.
      #
      # The previous attempt to satisfy both -- 0600 for this file, 0444 for
      # the rest -- passed the mode check and then failed one step later with
      # "cat: /run/secrets/elastic_password: Permission denied", because the
      # entrypoint reads the file as the elasticsearch user, not as root. It
      # looked fixed: the old error was gone and the modules loaded. It was
      # not: the container boots, throws a fatal exception and restarts, in a
      # loop.
      #
      # generate_secrets.py already renders ELASTIC_PASSWORD into .env with the
      # same value, and Compose interpolates .env by itself, so dropping the
      # file indirection removes the conflict rather than balancing it. This is
      # the development stack; in production use real Docker secrets, where the
      # orchestrator owns the file as the service user.
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?run "make bootstrap" first}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - naso-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --user elastic:$${ELASTIC_PASSWORD} https://localhost:9200 -k >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: quay.io/minio/minio
    container_name: naso-storage
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: naso_storage_admin
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    secrets:
      - minio_password
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data/minio:/data
    networks:
      - naso-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: naso-broker
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # These official images start as root to chown their data directory and
    # then drop to their service user, which needs SETUID/SETGID; the chown
    # itself needs CHOWN/FOWNER/DAC_OVERRIDE. With `cap_drop: ALL` and nothing
    # added back they crash-loop before the server ever starts (redis exits
    # 127 — its entrypoint cannot exec). These grants used to live in a
    # docker-compose.override.yml, which Compose applied automatically and
    # invisibly; they are stated here instead. The API and worker containers,
    # which run application code, keep `cap_drop: ALL` with nothing added.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - SETFCAP
    networks:
      - naso-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: naso-jaeger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - naso-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # This Compose file is the development and evaluation stack, so the
        # image ships pytest — cli/validate.sh runs the suite with
        # `docker exec naso-api pytest tests/`. Production builds omit this.
        INSTALL_DEV: "true"
    container_name: naso-api
    restart: always
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    depends_on:
      - db
    volumes:
      - ./shared:/app/shared
      - ./.secrets-mock:/run/secrets:ro
    ports:
      - "8000:8000"
    networks:
      - naso-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: naso-worker-pipeline
    command: celery -A shared.celery_app worker -Q default,osint --concurrency=4 --loglevel=info
    restart: always
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/pwuser/.cache
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    volumes:
      - ./shared:/app/shared
      - ./.secrets-mock:/run/secrets:ro
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - naso-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker-massive:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: naso-worker-massive
    command: celery -A shared.celery_app worker -Q massive --concurrency=1 --loglevel=info
    restart: always
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/pwuser/.cache
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

    volumes:
      - ./shared:/app/shared
      - ./.secrets-mock:/run/secrets:ro
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - naso-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- TOR CLUSTER ---
  naso-tor-1:
    build:
      context: ./infrastructure/tor
      dockerfile: Dockerfile.tor
    restart: always
    networks:
      - naso-net

  naso-tor-2:
    build:
      context: ./infrastructure/tor
      dockerfile: Dockerfile.tor
    restart: always
    networks:
      - naso-net

  naso-tor-3:
    build:
      context: ./infrastructure/tor
      dockerfile: Dockerfile.tor
    restart: always
    networks:
      - naso-net

  naso-tor-4:
    build:
      context: ./infrastructure/tor
      dockerfile: Dockerfile.tor
    restart: always
    networks:
      - naso-net

  naso-tor-5:
    build:
      context: ./infrastructure/tor
      dockerfile: Dockerfile.tor
    restart: always
    networks:
      - naso-net

  naso-tor-lb:
    image: haproxy:alpine
    container_name: naso-tor-cluster
    restart: always
    volumes:
      - ./infrastructure/tor/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - naso-net


networks:
  naso-net:
    driver: bridge

secrets:
  db_password:
    file: .secrets-mock/db_password.txt
  rabbit_password:
    file: .secrets-mock/rabbit_password.txt
  minio_password:
    file: .secrets-mock/minio_password.txt
