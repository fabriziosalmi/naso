global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 2000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m

# Docker's embedded DNS server, present on every user-defined bridge network.
# Without a resolvers section haproxy resolves each backend name once, through
# libc, at startup — so an instance that comes up later, or moves to a new
# address on restart, stays unreachable until haproxy itself is restarted.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 1s
    hold other 1s

listen stats
    bind :1936
    mode http
    stats enable
    stats uri /

listen tor-cluster
    bind :8118
    mode tcp
    balance roundrobin
    # `init-addr last,libc,none` is what makes this cluster a cluster.
    #
    # By default haproxy treats an unresolvable backend name as a fatal
    # configuration error and exits. Every Tor instance was crash-looping (see
    # Dockerfile.tor), so Docker's DNS had nothing to answer with, and haproxy
    # aborted at boot:
    #
    #   [ALERT] 'server tor-cluster/tor1' : could not resolve address
    #           'naso-tor-1'. Failed to initialize server(s) addr.
    #
    # The point of five instances behind a round-robin balancer is that losing
    # one costs a fifth of the capacity. Instead, one missing instance took the
    # only route to Tor down with it and every dark-web task lost its proxy.
    # With this option a name that does not resolve yet starts the server in a
    # down state, health checks pick it up when it appears, and the survivors
    # keep serving.
    default-server check inter 5s fall 3 rise 2 init-addr last,libc,none resolvers docker resolve-prefer ipv4
    # Distribuzione su 5 istanze Tor locali
    server tor1 naso-tor-1:9050
    server tor2 naso-tor-2:9050
    server tor3 naso-tor-3:9050
    server tor4 naso-tor-4:9050
    server tor5 naso-tor-5:9050
