name: NASO CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (format + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ruff
        run: pip install ruff
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    needs: ruff
    # Job-level cap. Pytest itself is bounded by --timeout=60 below; a
    # job-level ceiling guards against the overhead beyond that
    # (download caches, network stalls during pip install, etc.) so a
    # silent hang surfaces in 15 minutes instead of GitHub's default 6 h.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            shared/requirements-shared.txt
      - name: Install dependencies
        # backend/requirements.txt embeds ``-r shared/requirements-shared.txt``,
        # whose path resolves relative to ``backend/`` (where the parent file
        # lives) — not relative to the workflow CWD. The Dockerfile makes it
        # work by COPY-ing both into /app/ with the right layout, but the
        # workflow runs against the source tree. Strip the nested -r and
        # install the two files explicitly.
        run: |
          pip install -r shared/requirements-shared.txt
          grep -v '^-r ' backend/requirements.txt > /tmp/backend_reqs.txt
          pip install -r /tmp/backend_reqs.txt
      - name: Run pytest
        env:
          # Tests run against in-memory SQLite via conftest.py; the
          # secrets here are only consumed when imports touch settings.
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
          ALGORITHM: HS256
          JWT_PRIVATE_KEY: ci-test-secret
          JWT_PUBLIC_KEY: ci-test-secret
          RABBITMQ_USER: ci
          RABBITMQ_PASS: ci
        # ``--timeout=60`` (pytest-timeout) lets us actually see *which*
        # test is hanging when one of them holds the worker. Default
        # ``thread`` method works for both async and sync tests.
        run: pytest backend/tests -v --maxfail=10 --timeout=60 -W ignore::DeprecationWarning

  frontend-tests:
    name: Frontend vitest
    runs-on: ubuntu-latest
    needs: ruff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Vitest
        run: npm test -- --run
        working-directory: frontend

  docker-smoke:
    name: Docker compose smoke
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bootstrap deps
        run: pip install cryptography
      - name: Bootstrap secrets and .env
        run: make bootstrap
      - name: Build images
        run: docker compose build backend worker-pipeline
      - name: Start dependencies
        run: docker compose up -d db redis rabbitmq
      - name: Wait for db + rabbitmq healthchecks
        # Compose --wait blocks until every service with a healthcheck reports
        # healthy, or aborts with a non-zero exit. Replaces brittle `sleep`s.
        run: docker compose up -d --wait db rabbitmq
        timeout-minutes: 3
      - name: Start backend
        run: docker compose up -d backend
      - name: Verify backend container is running, not crash-looping
        run: |
          set -e
          # Give the backend up to 30s to boot. Fail loudly if it exits or restarts.
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Status}}' naso-api 2>/dev/null || echo "missing")
            if [ "$status" = "running" ]; then
              echo "backend is running"
              exit 0
            fi
            if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              echo "backend container is in state '$status' — dumping logs and failing CI"
              docker logs naso-api || true
              exit 1
            fi
            sleep 1
          done
          echo "backend did not reach 'running' state in 30s"
          docker logs naso-api || true
          exit 1
      - name: Backend logs (always, for diagnostics)
        if: always()
        run: docker logs naso-api || true
